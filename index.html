<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#183c4a">
<title>LIAME</title>
 <link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#f3f0e9;
 color:#183c4a;font-family:Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
 text-align:center
}
main{width:100%;max-width:480px;padding:25px}
h1{font-size:52px;margin:0 0 8px}
.slogan{font-size:16px;margin-bottom:35px}
.bulle{
 background:white;border-radius:20px;
 padding:18px;margin:15px 0;
 font-size:19px;line-height:1.5;text-align:left
}
.etiquette{font-size:13px;font-weight:bold;opacity:.7}
button{
 background:#183c4a;color:white;border:0;
 border-radius:35px;padding:19px 25px;
 font-size:19px;width:100%;margin-top:12px
}
button:disabled{opacity:.5}
#statut{font-size:15px;min-height:24px;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>LIAME</h1>
<p class="slogan">Plus de lien, plus d'humain, plus de vie.</p>

<div class="bulle">
 <div class="etiquette">LIAME</div>
 <div id="reponse">Bonjour Janine !</div>
</div>

<div class="bulle">
 <div class="etiquette">VOUS</div>
 <div id="paroles">Appuie sur le micro pour me parler.</div>
</div>

<button id="micro" onclick="ecouter()">🎙️ Parler à LIAME</button>
<button onclick="saluer()">🔊 Écouter LIAME</button>
<p id="statut">Prêt à discuter.</p>
</main>

<script>
 const SUPABASE_PUBLIC_KEY = "sb_publishable_zXi0xAmuK1vrMaEkCN2gxg_MFCyxvmW";
const SUPABASE_URL = "https://ymsetvfrvpqtudvypktn.supabase.co";
 let liameJeton = "";

const zoneTest = document.createElement("section");
zoneTest.innerHTML =
  '<input id="liame-email" type="email" placeholder="E-mail du compte test" autocomplete="username" style="width:100%;padding:12px;margin:6px 0">' +
  '<input id="liame-mdp" type="password" placeholder="Mot de passe" autocomplete="current-password" style="width:100%;padding:12px;margin:6px 0">' +
  '<button id="liame-test" type="button">Tester le cerveau IA</button>' +
  '<p id="liame-resultat"></p>';
document.querySelector("main").prepend(zoneTest);

document.getElementById("liame-test").addEventListener("click", async () => {
  const resultat = document.getElementById("liame-resultat");
  const email = document.getElementById("liame-email").value.trim();
  const password = document.getElementById("liame-mdp").value;

  if (!email || !password) {
    resultat.textContent = "Entre ton e-mail et ton mot de passe de test.";
    return;
  }

  resultat.textContent = "Connexion en cours...";

  try {
    const authResponse = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_PUBLIC_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email: email, password: password })
    });

    const auth = await authResponse.json();
    if (!authResponse.ok || !auth.access_token) {
      throw new Error("Connexion refusée (" + authResponse.status + ")");
    }

    liameJeton = auth.access_token;
    document.getElementById("liame-mdp").value = "";
    resultat.textContent = "LIAME réfléchit...";

    const response = await fetch(SUPABASE_URL + "/functions/v1/liame-cerveau", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_PUBLIC_KEY,
        "Authorization": "Bearer " + liameJeton,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "Bonjour LIAME, propose-moi un sujet de conversation sur les années 1980."
      })
    });

    const data = await response.json();
    resultat.textContent = response.ok
      ? data.message
      : "Erreur cerveau " + response.status + " : " + (data.error || "inconnue");

    if (response.ok && data.message) dire(data.message);
  } catch (erreur) {
    resultat.textContent = erreur.message || "Erreur de connexion";
  }
});
 const Reconnaissance =
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

const micro=document.getElementById("micro");
const statut=document.getElementById("statut");
const paroles=document.getElementById("paroles");
const reponse=document.getElementById("reponse");

let reconnaissance=null;
let enCours=false;

function dire(texte){
 reponse.textContent=texte;
 if(!("speechSynthesis" in window)){
  statut.textContent="Voix non disponible.";
  return;
 }
 speechSynthesis.cancel();
 const phrase=new SpeechSynthesisUtterance(
  texte.replace(/LIAME/gi,"Liame")
 );
 phrase.lang="fr-FR";
 phrase.rate=0.9;
 phrase.pitch=0.95;
 phrase.onerror=()=>{statut.textContent="Erreur de lecture vocale.";};
 speechSynthesis.speak(phrase);
}

function saluer(){
 dire("Bonjour Janine ! Je suis Liame. Comment vas-tu aujourd'hui ?");
}

function repondre(texte){
 const t=texte.toLocaleLowerCase("fr-FR");
 let r;
 if(t.includes("bonjour")||t.includes("salut")){
  r="Bonjour Janine ! Je suis content de t'entendre. Comment vas-tu ?";
 }else if(t.includes("comment")&&t.includes("vas")){
  r="Je vais très bien, merci ! Et toi, raconte-moi ta journée.";
 }else if(t.includes("bien")||t.includes("ça va")){
  r="Ça me fait plaisir ! Qu'est-ce qui t'a fait sourire aujourd'hui ?";
 }else if(t.includes("nouvelle")||t.includes("famille")){
  r="Pour le moment, je n'ai pas encore accès aux nouvelles de ta famille. Nous allons bientôt y remédier.";
 }else if(t.includes("jeu")||t.includes("quiz")){
  r="Avec plaisir ! Nous préparons un grand jeu de questions ensemble.";
 }else if(t.includes("au revoir")){
  r="À bientôt Janine ! Prends bien soin de toi.";
 }else{
  r="Je t'ai entendue, Janine. Pour le moment, j'apprends encore à discuter. Bientôt, nous pourrons parler de beaucoup plus de choses.";
 }
 dire(r);
}

function ecouter(){
 if(!Reconnaissance){
  statut.textContent="Reconnaissance vocale indisponible dans ce navigateur.";
  return;
 }
 if(enCours)return;
 speechSynthesis.cancel();
 reconnaissance=new Reconnaissance();
 reconnaissance.lang="fr-FR";
 reconnaissance.continuous=false;
 reconnaissance.interimResults=false;
 reconnaissance.maxAlternatives=1;
 reconnaissance.onstart=()=>{
  enCours=true;
  micro.disabled=true;
  statut.textContent="Je t'écoute...";
 };
 reconnaissance.onresult=(event)=>{
  const texte=event.results[0][0].transcript;
  paroles.textContent=texte;
  statut.textContent="J'ai entendu ta phrase.";
  if (!liameJeton) {
  statut.textContent = "Connecte-toi d'abord avec Tester le cerveau IA.";
  return;
}
statut.textContent = "LIAME réfléchit...";
fetch(SUPABASE_URL + "/functions/v1/liame-cerveau", {
  method: "POST",
  headers: {
    "apikey": SUPABASE_PUBLIC_KEY,
    "Authorization": "Bearer " + liameJeton,
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ message: texte })
})
.then(async response => {
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Erreur " + response.status);
  return data;
})
.then(data => {
  if (!data.message) throw new Error("Réponse vide");
  dire(data.message);
})
.catch(error => {
  statut.textContent = "Erreur LIAME : " + error.message;
});
 };
 reconnaissance.onerror=(event)=>{
  statut.textContent="Micro : "+event.error+
   ". Vérifie les autorisations ou réessaie.";
 };
 reconnaissance.onend=()=>{
  enCours=false;
  micro.disabled=false;
  if(statut.textContent==="Je t'écoute..."){
   statut.textContent="Je n'ai rien entendu. Réessaie.";
  }
 };
 try{
  reconnaissance.start();
 }catch(e){
  enCours=false;
  micro.disabled=false;
  statut.textContent="Impossible de démarrer le micro.";
 }
}
</script>
</body>
</html>
