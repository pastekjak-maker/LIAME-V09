name: Deploy LIAME Cerveau

on:
  push:
    paths:
      - ".github/workflows/deploy-liame.yml"
      - "supabase/functions/liame-cerveau/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy LIAME
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                run: supabase functions deploy liame-cerveau --project-ref ymsetvfrvpqtudvypktn --yes
